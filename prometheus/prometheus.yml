global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'fastapi-backend'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['fastapi-backend:8000']
        labels:
          service: 'banque-togo-api'

  - job_name: 'postgres-hub'
    static_configs:
      - targets: ['postgres-exporter:9187']
        labels:
          service: 'banque-togo-postgres'

  - job_name: 'mysql-credit'
    static_configs:
      - targets: ['mysql-exporter:9104']
        labels:
          service: 'banque-togo-mysql'

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
        labels:
          service: 'banque-togo-containers'
